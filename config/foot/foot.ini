# ~/.config/foot/foot.ini: Makima palette, semi-transparent
# Source: ~/.config/makima-sway/config/foot/foot.ini
# Colors: ~/.config/makima-sway/design/palette.md
# All options, with explanations: /etc/xdg/foot/foot.ini and "man foot.ini"

[main]
font=JetBrainsMono Nerd Font:size=10
# Inner padding so text doesn't touch the edge (horizontal x vertical, pixels)
pad=10x8
# Sway sees this as the window's app_id (use app_id="foot" in window rules)
app-id=foot

[scrollback]
lines=5000

[cursor]
style=block
blink=no

[mouse]
# Hide the mouse pointer while typing
hide-when-typing=yes

[colors-dark]
# 0.93: the background stays the palette's dark brown, the wallpaper only shows faintly.
# (0.85 was tried: the red wallpaper bled through and tinted the background red.)
alpha=0.93
background=140b07
foreground=e8dccb

# Normal colors (0-7): black red green yellow blue magenta cyan white
regular0=22140e
regular1=e22e0e
regular2=8fa86b
regular3=f2a33a
regular4=6a8fa8
regular5=c9566b
regular6=4f8f88
regular7=c9b8a6

# Bright colors (8-15)
bright0=6b5348
bright1=ff5a3c
bright2=a9c285
bright3=ffc266
bright4=8eb0c6
bright5=e07a8c
bright6=74b3ab
bright7=e8dccb

# Cursor: a crimson block (the main accent); the letter under it stays readable in dark. Selection: dark brown
cursor=140b07 e22e0e
selection-foreground=e8dccb
selection-background=3a231a

# Search results and URL hints
search-box-no-match=140b07 e22e0e
search-box-match=140b07 f2a33a
jump-labels=140b07 f2a33a
urls=f2a33a
