# ~/.config/fuzzel/fuzzel.ini: app launcher (Super+d), Makima palette
# Source: ~/.config/makima-sway/config/fuzzel/fuzzel.ini
# All options: "man fuzzel.ini"
# Color format: RRGGBBAA (last two digits are alpha, ff = fully opaque)

[main]
font=JetBrainsMono Nerd Font:size=11
prompt="❯ "
terminal=foot
# In the middle of the screen, a 10-line list
anchor=center
lines=10
width=40
horizontal-pad=16
vertical-pad=12
inner-pad=8
# Icons off: opens faster and looks cleaner
icons-enabled=no
# Fuzzy matching as you type: "frfx" -> Firefox
match-mode=fzf

[colors]
background=140b07ff
text=e8dccbff
prompt=e22e0eff
input=e8dccbff
placeholder=9f7f70ff
match=f2a33aff
selection=3a231aff
selection-text=e8dccbff
selection-match=f2a33aff
border=e22e0eff
counter=9f7f70ff

[border]
width=1
radius=0
